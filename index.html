<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معاينة الخط المخصص</title>
    <style>
        /* تعريف الخط المخصص باستخدام صيغة WOFF */
        @font-face {
            font-family: 'CustomFont';
            src: url('font.woff') format('woff'); /* قم بتغيير مسار الملف حسب مكان حفظه لديك */
            font-weight: normal;
            font-style: normal;
        }

        /* تنسيقات الصفحة العامة وتطبيق الخط */
        body {
            font-family: 'CustomFont', sans-serif;
            background-color: #faf8f5;
            color: #2c3e50;
            direction: rtl;
            text-align: right;
            margin: 0;
            padding: 50px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        h1 {
            color: #1a252f;
            border-bottom: 3px solid #3498db;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        p {
            font-size: 20px;
            line-height: 1.8;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>تجربة الخط المخصص</h1>
        <p>هذا النص مصمم ليعرض لك كيفية ربط ملف الـ WOFF بصفحة الـ HTML وعرضه بسلاسة باستخدام أكواد الـ CSS المرفقة أعلاه.</p>
    </div>
</body>
</html>
